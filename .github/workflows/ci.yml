name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (it runs locally
        # on Windows), but CI was Linux-only — i.e. it never tested the OS the
        # server actually ships on.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BOTH runtimes on purpose: Bun is the dev toolchain, Node is what this server
      # SHIPS on. Dropping setup-node would remove the only thing that proves the
      # published artifact still loads for consumers.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - name: Node runtime smoke (the shipped artifact must load under Node)
        run: |
          node --input-type=module -e '
            const entry = "./dist/index.js";
            const t = setTimeout(() => { console.log("PASS: self-started under Node (still running at 5s)"); process.exit(0); }, 5000);
            import(entry).then(() => { clearTimeout(t); console.log("PASS: loaded cleanly under Node"); process.exit(0); })
              .catch((e) => { clearTimeout(t); console.error("FAIL: " + entry + " does not load under Node -- " + e.message); process.exit(1); });
          '
