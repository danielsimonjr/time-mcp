version: 2
updates:
  # `npm`, NOT `bun` -- reverted 2026-09-05. I switched this to the bun ecosystem on
  # 09-04 reasoning that npm leaves bun.lock untouched. The reasoning was right about
  # the symptom and wrong about the fix: Dependabot's bun parser supports only
  # lockfileVersion 1, and Bun 1.4 writes 2, so the very next run failed with
  #   Unsupported bun.lock 'lockfileVersion' 2 in /bun.lock.
  # This fleet had already diagnosed and fixed exactly this twice before I touched it
  # (deepthinking-mcp 524ada7f, fzf-mcp 387ee494, and again Mathts c0dd0d1).
  #
  # IT HIDES WELL, which is why it is worth a comment: security ALERTS are
  # dependency-graph based and keep working, so nothing goes red. What dies is
  # automated REMEDIATION -- and "0 open PRs" then reads as health when it partly
  # means Dependabot cannot open one.
  #
  # bun.lock stays authoritative and is regenerated by `bun install`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [dependencies, npm]
    ignore:
      # TypeScript 7.x is blocked by the lint toolchain, not by our code.
      # typescript-eslint@8.65.0 — and every published 8.65.1-alpha — declares
      #   peer typescript ">=4.8.4 <6.1.0"
      # so TS 7 fails install with ERESOLVE before CI can even typecheck. PR #12
      # (bump typescript 5.9.3 -> 7.0.2) was therefore permanently red from
      # 2026-07-15 and was closed rather than merged with --legacy-peer-deps,
      # which would have installed a knowingly broken lint toolchain.
      #
      # Scoped to >=7 on purpose: TS 6.0.x satisfies that peer range (verified),
      # so 6.x upgrades still flow through normally.
      #
      # REMOVE THIS ENTRY once a typescript-eslint release admits TS >= 7 —
      # check with:  npm view typescript-eslint peerDependencies.typescript
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels: [dependencies, github-actions]
